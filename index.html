<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Effect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            color: #0106FF;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .text-container {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            white-space: pre-line;
            text-shadow: 0 0 5px #0106FF;
            position: absolute;
            z-index: 2;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="text-container" id="text"></div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        
        const drops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0106AA';
            ctx.font = `${fontSize}px monospace`;
            
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                drops[i] = y * fontSize > canvas.height && Math.random() > 0.975 ? 0 : y + 1;
            });
        }
        setInterval(drawMatrix, 50);
        
        const text = ["DEADLINE - MARCH 31, 2025", "more information:", "startschool.org"];
        let index = 0;
        let lineIndex = 0;
        const textContainer = document.getElementById("text");
        
        function getRandomSymbol() {
            const symbols = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
            return symbols[Math.floor(Math.random() * symbols.length)];
        }
        
        function typeText() {
            if (index < text[lineIndex].length) {
                let currentIndex = index;
                let iterations = 3;
                let interval = setInterval(() => {
                    textContainer.textContent = text.slice(0, lineIndex).join("\n") + "\n" + text[lineIndex].slice(0, currentIndex) + getRandomSymbol();
                    iterations--;
                    if (iterations === 0) {
                        clearInterval(interval);
                        textContainer.textContent = text.slice(0, lineIndex).join("\n") + "\n" + text[lineIndex].slice(0, currentIndex + 1);
                        index++;
                        setTimeout(typeText, 50);
                    }
                }, 30);
            } else if (lineIndex < text.length - 1) {
                index = 0;
                lineIndex++;
                setTimeout(typeText, 50);
            }
        }
        
        setTimeout(typeText, 1000);
    </script>
</body>
</html>
